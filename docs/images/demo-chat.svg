<svg width="1000" height="560" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Product mockup: neutral paper palette, hairline borders, no gradients, no emoji -->
  <defs>
    <style>
      .ui { font-family: "Segoe UI", Inter, -apple-system, sans-serif; }
      .mono { font-family: Consolas, "SF Mono", monospace; }
    </style>
  </defs>

  <!-- Browser frame -->
  <rect x="40" y="20" width="920" height="520" rx="10" fill="#FFFFFF" stroke="#DAD5CB"/>
  <rect x="40" y="20" width="920" height="42" rx="10" fill="#F6F4EF"/>
  <rect x="40" y="46" width="920" height="16" fill="#F6F4EF"/>
  <circle cx="68" cy="41" r="5" fill="#DAD5CB"/>
  <circle cx="88" cy="41" r="5" fill="#DAD5CB"/>
  <circle cx="108" cy="41" r="5" fill="#DAD5CB"/>
  <rect x="146" y="30" width="480" height="21" rx="10" fill="#FFFFFF" stroke="#DAD5CB"/>
  <text x="162" y="45" class="mono" font-size="12" fill="#9A958A">localhost:8088 — Rou-Bao&#8217;s Chat Corner</text>

  <!-- App header: type only, hairline rule -->
  <line x1="41" y1="104" x2="959" y2="104" stroke="#DAD5CB"/>
  <text x="500" y="82" class="ui" font-size="17" font-weight="600" fill="#1B1B18" text-anchor="middle">Rou-Bao&#8217;s Chat Corner</text>
  <text x="500" y="98" class="ui" font-size="11" fill="#9A958A" text-anchor="middle">streaming reply &#183; intent classification + RAG</text>

  <!-- Chat area -->
  <rect x="41" y="105" width="918" height="410" fill="#FAF9F6"/>

  <!-- User message 1 (dark ink bubble) -->
  <rect x="624" y="140" width="286" height="42" rx="8" fill="#262B30"/>
  <text x="767" y="166" class="ui" font-size="13" fill="#ECEAE5" text-anchor="middle">I can&#8217;t sleep lately, the pressure is too much</text>

  <!-- Intent label: plain mono text, no pill -->
  <text x="910" y="200" class="mono" font-size="11" fill="#3F5382" text-anchor="end">CONSULT &#183; RAG</text>

  <!-- AI reply (white card, hairline border) -->
  <rect x="86" y="222" width="520" height="92" rx="8" fill="#FFFFFF" stroke="#DAD5CB"/>
  <text x="106" y="250" class="ui" font-size="13" fill="#333330">Hearing that insomnia has been wearing you down &#8212; that&#8217;s really hard.</text>
  <text x="106" y="274" class="ui" font-size="13" fill="#333330">Chronic stress disrupts sleep. Tonight, try the 4-7-8 breathing</text>
  <text x="106" y="298" class="ui" font-size="13" fill="#333330">exercise to help your body settle down<span fill="#3F5382">&#9612;</span></text>

  <!-- Retrieval footnote -->
  <text x="106" y="336" class="mono" font-size="11" fill="#9A958A">Milvus HNSW &#183; top-3 knowledge retrieved</text>

  <!-- User message 2 (risk) -->
  <rect x="700" y="372" width="210" height="42" rx="8" fill="#262B30"/>
  <text x="805" y="398" class="ui" font-size="13" fill="#ECEAE5" text-anchor="middle">I feel like I can&#8217;t hold on any more&#8230;</text>
  <text x="910" y="432" class="mono" font-size="11" font-weight="700" fill="#A2402C" text-anchor="end">RISK &#183; HIGH</text>

  <!-- AI intervention reply -->
  <rect x="86" y="372" width="560" height="42" rx="8" fill="#FFFFFF" stroke="#DAD5CB"/>
  <text x="106" y="398" class="ui" font-size="13" fill="#333330">Thank you for telling me. You are not alone in this. Right now, the most&#8230;</text>

  <!-- Alert footnote: text only -->
  <text x="106" y="440" class="mono" font-size="11" fill="#9A958A">alert email sent &#183; risk event logged &#183; pending human review</text>

  <!-- Input bar -->
  <line x1="41" y1="515" x2="959" y2="515" stroke="#DAD5CB"/>
  <rect x="70" y="524" width="790" height="30" rx="8" fill="#FFFFFF" stroke="#DAD5CB"/>
  <text x="88" y="544" class="ui" font-size="13" fill="#B5B0A4">Say something&#8230;</text>
  <rect x="876" y="523" width="64" height="32" rx="8" fill="#262B30"/>
  <text x="908" y="544" class="ui" font-size="13" font-weight="600" fill="#ECEAE5" text-anchor="middle">Send</text>
</svg>
