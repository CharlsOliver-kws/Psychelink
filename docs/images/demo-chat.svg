<svg width="1000" height="560" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="hdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 浏览器外框 -->
  <rect x="40" y="20" width="920" height="520" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <!-- 浏览器栏 -->
  <rect x="40" y="20" width="920" height="44" rx="16" fill="#e9ecf2"/>
  <rect x="40" y="48" width="920" height="16" fill="#e9ecf2"/>
  <circle cx="70" cy="42" r="6" fill="#ff5f57"/>
  <circle cx="92" cy="42" r="6" fill="#febc2e"/>
  <circle cx="114" cy="42" r="6" fill="#28c840"/>
  <rect x="150" y="32" width="480" height="20" rx="10" fill="#ffffff"/>
  <text x="166" y="46" font-family="Consolas, monospace" font-size="12" fill="#8a93a6">localhost:8088 — 肉包的聊天小站</text>

  <!-- 应用头部 -->
  <rect x="40" y="64" width="920" height="58" fill="url(#hdr)"/>
  <text x="500" y="90" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">肉包的聊天小站</text>
  <text x="500" y="110" font-family="Segoe UI, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">GLM-4.5 · 流式响应 · 意图识别 + RAG</text>

  <!-- 聊天区 -->
  <rect x="40" y="122" width="920" height="418" fill="#f5f7fa"/>

  <!-- 用户消息 1 -->
  <g>
    <rect x="620" y="150" width="290" height="44" rx="14" fill="url(#bubble)" filter="url(#softshadow)"/>
    <text x="765" y="177" font-family="Segoe UI, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">最近总是失眠，压力好大怎么办</text>
  </g>

  <!-- 意图徽章 -->
  <rect x="812" y="204" width="98" height="20" rx="10" fill="#f5a623" fill-opacity="0.15" stroke="#f5a623" stroke-opacity="0.5"/>
  <text x="861" y="218" font-family="Consolas, monospace" font-size="11" fill="#c47f00" text-anchor="middle">CONSULT · RAG</text>

  <!-- AI 回复（流式） -->
  <g>
    <rect x="90" y="236" width="500" height="96" rx="14" fill="#ffffff" filter="url(#softshadow)"/>
    <text x="110" y="264" font-family="Segoe UI, sans-serif" font-size="14" fill="#333">听到你最近被失眠困扰，真的很不容易。</text>
    <text x="110" y="288" font-family="Segoe UI, sans-serif" font-size="14" fill="#333">长期压力会影响睡眠质量，可以试试睡前</text>
    <text x="110" y="312" font-family="Segoe UI, sans-serif" font-size="14" fill="#333">进行 4-7-8 呼吸练习，帮助身体放松下来<span fill="#667eea">▌</span></text>
  </g>

  <!-- 知识库引用小标 -->
  <rect x="90" y="342" width="230" height="20" rx="10" fill="#4ea3ff" fill-opacity="0.12" stroke="#4ea3ff" stroke-opacity="0.4"/>
  <text x="205" y="356" font-family="Consolas, monospace" font-size="11" fill="#2a7bd4" text-anchor="middle">📚 Milvus Top-3 知识检索</text>

  <!-- 用户消息 2（风险） -->
  <g>
    <rect x="700" y="386" width="210" height="44" rx="14" fill="url(#bubble)" filter="url(#softshadow)"/>
    <text x="805" y="413" font-family="Segoe UI, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">感觉撑不下去了…</text>
  </g>
  <rect x="760" y="440" width="150" height="20" rx="10" fill="#e53e3e" fill-opacity="0.12" stroke="#e53e3e" stroke-opacity="0.5"/>
  <text x="835" y="454" font-family="Consolas, monospace" font-size="11" fill="#c53030" text-anchor="middle">RISK · HIGH ⚠</text>

  <!-- AI 干预回复（截断示意） -->
  <g>
    <rect x="90" y="386" width="560" height="44" rx="14" fill="#ffffff" filter="url(#softshadow)"/>
    <text x="110" y="413" font-family="Segoe UI, sans-serif" font-size="14" fill="#333">谢谢你愿意告诉我，你不是一个人。现在最…</text>
  </g>

  <!-- 预警邮件浮窗 -->
  <g filter="url(#softshadow)">
    <rect x="700" y="300" width="230" height="64" rx="10" fill="#fff8f0" stroke="#f5a623" stroke-opacity="0.6"/>
    <text x="716" y="324" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#c47f00">📧 风险预警已触发</text>
    <text x="716" y="344" font-family="Segoe UI, sans-serif" font-size="11" fill="#8a7350">邮件通知 + 事件落库 → 人工复核</text>
  </g>

  <!-- 输入区 -->
  <rect x="40" y="516" width="920" height="50" fill="#ffffff"/>
  <rect x="40" y="515" width="920" height="1" fill="#e0e0e0"/>
  <rect x="70" y="528" width="770" height="28" rx="14" fill="#f5f5f5" stroke="#e0e0e0"/>
  <text x="90" y="547" font-family="Segoe UI, sans-serif" font-size="13" fill="#aaa">输入您想说的话...</text>
  <rect x="860" y="526" width="76" height="32" rx="16" fill="url(#bubble)"/>
  <text x="898" y="547" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">发送</text>
</svg>
