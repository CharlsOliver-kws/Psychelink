  <!-- Mark: two thin interlocking rings — "link", nothing literal -->
  <g fill="none">
    <circle cx="778" cy="140" r="30" stroke="#ECEAE5" stroke-width="2.5"/>
    <circle cx="822" cy="140" r="30" stroke="#8598C2" stroke-width="2.5"/>
  </g>

  <!-- Title -->
  <text x="800" y="320" text-anchor="middle" font-family="Segoe UI, Inter, -apple-system, sans-serif"
        font-size="104" font-weight="600" fill="#ECEAE5" letter-spacing="-2">Psyche<tspan fill="#8E939B">Link</tspan></text>

