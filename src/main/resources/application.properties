# Application
spring.application.name=psychelink
server.port=8088

# Database: H2 内嵌（MySQL 模式，零依赖启动；可切换 docker-compose 中的 MySQL）
spring.datasource.url=${DB_URL:jdbc:h2:mem:psychelink;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.io.github.charlsoliver.psychelink=INFO

# OpenAPI 文档（/swagger-ui.html）；MCP 协议端点不纳入文档
springdoc.paths-to-exclude=/sse/**,/mcp/**,/h2-console/**

# LLM: OpenAI 兼容 API（默认智谱 GLM，可换任意兼容端点）
# 未配置 key 时使用哑值保证应用可启动（LLM 调用失败时由服务层降级处理）
spring.ai.openai.api-key=${ZHIPU_API_KEY:demo-key-not-set}
spring.ai.openai.base-url=${LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
spring.ai.openai.chat.options.model=${LLM_MODEL:glm-4.5-air}
spring.ai.openai.embedding.options.model=${LLM_EMBEDDING_MODEL:embedding-2}

# MCP Server（工具经 MCP 协议暴露给外部 AI 客户端，端点受 RBAC 保护）
spring.ai.mcp.server.name=psychelink
spring.ai.mcp.server.version=0.2.0

# Milvus 向量数据库
milvus.host=${MILVUS_HOST:localhost}
milvus.port=${MILVUS_PORT:19530}
milvus.collection=psychelink_knowledge
milvus.dimension=1024

# JWT（生产环境务必通过 JWT_SECRET 环境变量指定强随机密钥）
app.jwt.secret=${JWT_SECRET:psychelink-dev-secret-change-me-in-production-0123456789}
app.jwt.expire-hours=${JWT_EXPIRE_HOURS:24}

# 管理员引导（不设 ADMIN_PASSWORD 则启动时生成随机密码并打印到日志）
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

# 知识库自动导入（测试环境可关闭）
app.kb.auto-import=${KB_AUTO_IMPORT:true}

# 风险预警邮件（QQ SMTP；MAIL_PASSWORD 为授权码而非登录密码）
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# 预警接收邮箱
app.alert.recipient=${ALERT_RECIPIENT:}

# Excel 台账
app.excel.enabled=true
