# Application
spring.application.name=psychelink
server.port=8088

# Database: H2 内嵌（MySQL 模式，零依赖启动；可切换 docker-compose 中的 MySQL）
spring.datasource.url=${DB_URL:jdbc:h2:mem:psychelink;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.com.psychic.agent=INFO

# LLM: OpenAI 兼容 API（默认智谱 GLM，可换任意兼容端点）
spring.ai.openai.api-key=${ZHIPU_API_KEY:}
spring.ai.openai.base-url=${LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
spring.ai.openai.chat.options.model=${LLM_MODEL:glm-4.5-air}
spring.ai.openai.embedding.options.model=${LLM_EMBEDDING_MODEL:embedding-2}

# ChromaDB
chromadb.url=${CHROMA_URL:http://localhost:8000}
chromadb.collection=psychelink-knowledge
chromadb.tenant=default_tenant
chromadb.database=default_database

# 风险预警邮件（QQ SMTP；MAIL_PASSWORD 为授权码而非登录密码）
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# 预警接收邮箱
app.alert.recipient=${ALERT_RECIPIENT:}
